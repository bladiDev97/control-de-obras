service: control-obras-backend

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
  environment:
    NODE_ENV: ${self:provider.stage}
    TZ: 'America/Mexico_City'
    DYNAMO_TABLE_NAME: ${env:DYNAMO_TABLE_NAME, 'ControlDeObras'}
    DYNAMO_REGION: ${self:provider.region}
    JWT_SECRET: ${env:JWT_SECRET, 'serverless_jwt_secret_key'}
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '587'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASS: ${env:SMTP_PASS, ''}
    S3_UPLOADS_BUCKET: ${env:S3_UPLOADS_BUCKET, 'control-de-obras-frontend-808433583479'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:DescribeTable
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_NAME}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_NAME}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:PutObjectAcl
          Resource:
            - arn:aws:s3:::control-de-obras-*/*

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'
      - schedule: rate(15 minutes)

package:
  patterns:
    - 'dist/**'
    - 'assets/**'
    - '!src/**'
    - '!test/**'
